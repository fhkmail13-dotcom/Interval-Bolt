<script>
'use strict';
const $ = id => document.getElementById(id);
const node = (tag, text, cls) => {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (cls) element.className = cls;
  return element;
};
const el = (tag, cls, ...children) => {
  const element = node(tag, undefined, cls);

};
const button = (label, action, cls) => {

  return element;
};
const empty = text => node('div', text, 'empty');
const panel = (title, ...items) => el('section', 'panel', node('h2', title), ...items);
const uid = () => globalThis.crypto?.randomUUID?.() || Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join('');
const iso = (time = Date.now()) => new Date(time).toISOString();
const day = date => {
  const d = new Date(date);
  return [String(d.getFullYear()).padStart(4, '0'), String(d.getMonth()+1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
};
const stamp = value => new Date(value).toLocaleString(undefined, {dateStyle:'medium',timeStyle:'medium'});
const clockText = ms => {
  const seconds = Math.floor(Math.max(0, ms)/1000);
  return String(Math.floor(seconds/60)).padStart(2,'0') + ':' + String(seconds%60).padStart(2,'0');
};
const kinds = {
  frequency:'Frequency', duration:'Duration', latency:'Latency', partial:'Partial interval',
  whole:'Whole interval', skill:'Skill trials'
};
const moduleLabels = {...kinds, abc:'ABC logging', context:'Daily context notes', graphs:'Live graphs'};
const contextFields = ['Wins & Highlights','What Worked Well Today','Sensory/Schedule Notes','Peer & Classroom Context'];
const defaultPrompts = [
  ['+','Independent',true,true],['G','Gestural',false,true],['V','Verbal',false,true],
  ['M','Model',false,true],['PP','Partial Physical',false,true],
  ['FP','Full Physical',false,true],['−','Incorrect',false,false]
];
const palettes = {emerald:['#006855','#e0ff9b'], ocean:['#155a91','#bdeeff'], slate:['#404d69','#d5e3fa'], lavender:['#68409a','#eed7ff']};
const fresh = () => ({
  format:'Interval-Bolt',version:1,revision:0,learners:[],targets:[],sessions:[],events:[],abc:[],notes:[],phases:[],
  settings:{theme:'system',layout:'auto',palette:'emerald',accent:'#e0ff9b',customAccent:'#006855',card:'',highlight:'',
    privacy:false,haptic:true,audio:false,modules:{},prompts:defaultPrompts.map(row=>[...row]),fields:[...contextFields],
    antecedents:['Demand placed','Transition','Denied access','Unstructured time','Peer interaction'],
    consequences:['Verbal redirection','Planned ignoring','Escape/Break given','Tangible delivered','Praise/Reinforcement']}
});
const clone = value => JSON.parse(JSON.stringify(value));
const main = $('main');
const dialog = $('dialog');
dialog.setAttribute('aria-labelledby','dialog-title');
let state = fresh(), repo, page = 'session', learnerId = '', pending = 0, blocked = false, persistenceError = '';
let undoAction = null, toastTimer, renderTicks = [], tapeOpen = false;
let saveScheduled = false, saveInFlight = false, savedRevision = 0;
let report = {mode:'day',start:day(Date.now()),end:day(Date.now()),cluster:day(Date.now())};
let sessionStartPending = false;

function notice(message, undo = null, timeout = 5000) {
  clearTimeout(toastTimer);
  undoAction = undo;
  $('message').textContent = message;
  $('undo').hidden = !undo;
  $('notice').hidden = false;
  if (timeout) toastTimer = setTimeout(()=>{ $('notice').hidden=true; }, timeout);
}
function dismiss() {
  clearTimeout(toastTimer);
  undoAction = null;
  $('notice').hidden = true;
}
function undo() {
  const action = undoAction;
  if (!action) return;
  dismiss();
  action();
  notice('Last change undone');
}
function invoke(action) {
  try { Promise.resolve(action()).catch(error => notice(error.message, null, 0)); }
  catch (error) { notice(error.message, null, 0); }
}
function status() {
  $('status').textContent = persistenceError || (pending ? 'Saving…' : repo?.label || 'Opening storage…');
}
const storageKey = 'interval-bolt.workspace.v1';
function openIDB(name = 'interval-bolt') {
  return new Promise((resolve,reject) => {
    const request = indexedDB.open(name,1);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains('workspace')) request.result.createObjectStore('workspace');
    };
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Close older Interval-Bolt tabs and reload.'));
    request.onsuccess = () => resolve(request.result);
  });
}
function idbRepository(db) {
  if (!db.objectStoreNames.contains('workspace')) throw new Error('The local database is missing its workspace store.');
  db.onversionchange = () => {
    db.close();
    blocked = true;
    persistenceError = 'Storage changed. Take a snapshot, then reload.';
    status();
  };
  return {
    label:'Saved on this device',
    read() {
      return new Promise((resolve,reject) => {
        const request = db.transaction('workspace').objectStore('workspace').get('current');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    },
    save(next, expected) {
      return new Promise((resolve,reject) => {
        const tx = db.transaction('workspace','readwrite');
        const store = tx.objectStore('workspace');
        let conflict = false;
        const request = store.get('current');
        request.onsuccess = () => {
          if ((request.result?.revision || 0) !== expected) {
            conflict = true;
            tx.abort();
          } else store.put(next,'current');
        };
        tx.oncomplete = resolve;
        tx.onabort = () => reject(conflict ? new Error('Another tab saved changes. Take a snapshot, then reload.') : tx.error || new Error('Local save failed.'));
      });
    }
  };
}
function localRepository() {
  const read = () => JSON.parse(localStorage.getItem(storageKey) || 'null');
  return {
    label:'Saved locally · limited storage',
    read,
    async save(next, expected) {
      if ((read()?.revision || 0) !== expected) throw new Error('Another tab saved changes. Take a snapshot, then reload.');
      localStorage.setItem(storageKey,JSON.stringify(next));
    }
  };
}
async function repository() {
  if (localStorageAvailable() && localStorage.getItem(storageKey) !== null) return localRepository();
  if (!globalThis.indexedDB) return localRepository();
  let db;
  try { db = await openIDB(); }
  catch (error) {
    if (['SecurityError','InvalidStateError','NotSupportedError'].includes(error.name)) return localRepository();
    throw error;
  }
  return idbRepository(db);
}
function localStorageAvailable() {
  try { localStorage.getItem(storageKey); return true; }
  catch { return false; }
}
function commit(change, redraw = true) {
  if (!repo || blocked) throw new Error(persistenceError || 'Storage is not ready.');
  change(state);
  state.revision++;
  pending = 1;
  status();
  scheduleSave();
  if (redraw) render();
}
function scheduleSave() {
  if (saveScheduled || saveInFlight || blocked) return;
  saveScheduled = true;
  new Promise(resolve=>setTimeout(resolve,0)).then(async () => {
    saveScheduled = false;
    saveInFlight = true;
    const next = clone(state);
    await repo.save(next,savedRevision);
    savedRevision = next.revision;
  }).catch(error => {
    blocked = true;
    persistenceError = error.message === 'Another tab saved changes. Take a snapshot, then reload.' ? error.message :
      'Local save failed. Take a snapshot before closing.';
    notice(persistenceError,null,0);
  }).finally(() => {
    saveInFlight = false;
    pending = !blocked && savedRevision!==state.revision ? 1 : 0;
    status();
    if (pending) scheduleSave();
  });
}
function field(label, value = '', options = {}) {
  const input = node(options.multiline ? 'textarea' : 'input');
  if (!options.multiline) input.type = options.type || 'text';
  input.value = value;
  input.required = !!options.required;
  if (options.min !== undefined) input.min = options.min;
  if (options.max !== undefined) input.max = options.max;
  if (options.step !== undefined) input.step = options.step;
  if (options.maxLength) input.maxLength = options.maxLength;
  return {input,view:el('label','',label,input)};
}
function picker(label, value, options) {
  const input = node('select');
  for (const [key,title] of options) {
    const option = node('option',title);
    option.value = key;
    input.append(option);
  }
  input.value = value;
  return {input,view:el('label','',label,input)};
}
function check(label, checked) {
  const input = node('input');
  input.type = 'checkbox';
  input.checked = checked;
  return {input,view:el('label','check',input,label)};
}
function form(fields, label, submit) {
  const save = node('button',label,'primary');
  save.type = 'submit';
  const container = el('form','stack',...fields,el('div','row',save));
  container.addEventListener('submit',event => {
    event.preventDefault();
    invoke(submit);
  });
  return container;
}
function modal(title, contents) {
  $('dialog-title').textContent = title;
  $('dialog-body').replaceChildren(contents);
  if (!dialog.open) dialog.showModal();
}
function confirmAction(title, description, label, action) {
  modal(title,el('div','stack',node('p',description),
    el('div','row',button('Cancel',()=>dialog.close()),button(label,()=>{action();dialog.close();},'danger'))));
}
function requiredText(input) {
  const value = input.value.trim();
  if (!value) throw new Error('Enter a value before saving.');
  return value;
}
function activeSession() { return state.sessions.find(item=>!item.end); }
function selectedLearner() { return state.learners.find(item=>item.id===learnerId); }
function initials(name) {
  return name.trim().split(/\s+/u).filter(Boolean).slice(0,3).map(part=>Array.from(part)[0].toUpperCase()).join('');
}
function learnerName(id) {
  const learner = state.learners.find(item=>item.id===id);
  if (!learner) return 'Learner';
  return state.settings.privacy ? initials(learner.name) : learner.name;
}
function visibleText(value) {
  if (!state.settings.privacy) return value;
  const names = state.learners.map(item=>item.name).sort((a,b)=>b.length-a.length);
  let result = value;
  for (const name of names) {
    const escaped = name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    result = result.replace(new RegExp(escaped,'giu'),initials(name));
  }
  return result;
}
function enabled(learner, type) {
  return state.settings.modules[type] !== false && learner?.modules?.[type] !== false;
}
function feedback() {
  if (state.settings.haptic) navigator.vibrate?.(18);
}
function hero(title, subtitle, actions, eyebrow = 'Interval-Bolt') {
  return el('header','hero',el('div','',node('span',eyebrow,'eyebrow'),node('h1',title),node('p',subtitle)),el('div','row',actions));
}
function learnerEditor(learner) {
  const alias = field('Learner name or local ID',learner?.name || '',{required:true,maxLength:100});
  const modules = Object.entries(moduleLabels).map(([type,title]) => [type,check(title,learner?.modules?.[type] !== false)]);
  modal(learner ? 'Edit learner' : 'Add learner',form([
    alias.view,el('fieldset','row',node('legend','Modules for this learner'),modules.map(([,item])=>item.view))
  ],'Save learner',()=>{
    const name = requiredText(alias.input);
    const record = {id:learner?.id || uid(),name,modules:Object.fromEntries(modules.map(([key,item])=>[key,item.input.checked]))};
    learnerId = record.id;
    commit(db=>{
      if (learner) db.learners[db.learners.findIndex(item=>item.id===record.id)] = record;
      else db.learners.push(record);
    });
    dialog.close();
  }));
}
function targetEditor(learner, target) {
  const name = field('Target name',target?.name || '',{required:true,maxLength:120});
  const description = field('Operational definition',target?.description || '',{multiline:true,maxLength:2000});
  const type = picker('Measurement',target?.type || 'frequency',Object.entries(kinds));
  if (target) type.input.disabled = true;
  const interval = field('Interval length, seconds',target?.interval || 15,{type:'number',required:true,min:1,max:3600,step:1});
  const update = () => {interval.view.hidden = !['partial','whole'].includes(type.input.value);};
  type.input.addEventListener('change',update);
  update();
  modal(target ? 'Edit target' : 'Add target',form([name.view,description.view,type.view,interval.view],'Save target',()=>{
    const record = {id:target?.id || uid(),learner:learner.id,name:requiredText(name.input),
      description:description.input.value, type:type.input.value,interval:Number(interval.input.value),archived:false};
    commit(db=>{
      if (target) db.targets[db.targets.findIndex(item=>item.id===target.id)] = {...record,archived:target.archived};
      else db.targets.push(record);
    });
    dialog.close();
  }));
}
function phaseEditor(learner) {
  const label = field('Phase label','',{required:true,maxLength:120});
  const date = field('Effective date',day(Date.now()),{type:'date',required:true});
  modal('Add phase marker',form([label.view,date.view],'Save phase',()=>{
    const entry = {id:uid(),learner:learner.id,label:requiredText(label.input),date:date.input.value};
    commit(db=>db.phases.push(entry));
    dialog.close();
  }));
}
function learnerSelect(action = render) {
  const selection = picker('Learner',learnerId,state.learners.map(item=>[item.id,learnerName(item.id)]));
  if (state.learners.length) selection.input.addEventListener('change',()=>{learnerId=selection.input.value; action();});
  return selection.view;
}
function learnerPage() {
  const learner = selectedLearner();
  main.append(hero('Learners & targets','Set up the learners and measures you’ll use during sessions.',button('Add learner',()=>learnerEditor(),'primary')));
  if (!learner) {

    commit(db=>Object.assign(db.settings,{theme:theme.input.value,layout:layout.input.value,palette:palette.input.value,
      customAccent:custom.input.value,accent:accent.input.value,card:cardOn.input.checked?card.input.value:'',
      highlight:highlightOn.input.checked?highlight.input.value:'',haptic:haptic.input.checked,audio:audio.input.checked}));
    notice('Appearance saved');
  });
  const modules=Object.entries(moduleLabels).map(([key,label])=>[key,check(label,s.modules[key]!==false)]);
  const moduleForm=form(modules.map(([,item])=>item.view),'Save modules',()=>{
    commit(db=>{db.settings.modules=Object.fromEntries(modules.map(([key,item])=>[key,item.input.checked]));});
    notice('Modules saved');
  });
  const backupInput=node('input');
  backupInput.type='file';
  backupInput.accept='.json,application/json';
  backupInput.hidden=true;
  backupInput.addEventListener('change',()=>{
    const file=backupInput.files[0];
    backupInput.value='';
    invoke(()=>restoreFile(file));
  });
  main.append(el('div','grid',panel('Appearance & feedback',appearance),el('div','',
    panel('Workspace modules',moduleForm),
    panel('Recording options',el('div','row',button('Prompt hierarchy',promptEditor),
      button('ABC chip banks',banksEditor),button('Daily note fields',noteFieldsEditor))),
    panel('Backup & restore',node('p','A quick snapshot includes the current session and all saved records. Privacy mode removes notes and masks learner names in the exported copy.','muted'),
      el('div','row',button('Download snapshot',quickSnapshot,'primary'),button('Restore snapshot',()=>backupInput.click()),backupInput)),
    panel('Verification',button('Run self-checks',async()=>{
      const results=await selfTest();
      modal('Verification results',el('ol','',results.map(item=>node('li',item))));
    })))));
}
function promptEditor() {
  if(state.settings.privacy) throw new Error('Turn off privacy mode to edit custom prompt labels.');
  const rows=state.settings.prompts.map(row=>[...row]);
  const list=el('div','stack');
  function draw() {
    list.replaceChildren(...rows.map((row,index)=>{
      const code=field('Code',row[0],{required:true,maxLength:24});
      const label=field('Label',row[1],{required:true,maxLength:120});
      const independent=check('Independent',row[2]), correct=check('Correct',row[3]);
      for (const [item,col] of [[code,0],[label,1],[independent,2],[correct,3]]) {
        item.input.addEventListener('input',()=>{row[col]=col<2?item.input.value:item.input.checked;});
      }
      return el('div','card stack',code.view,label.view,el('div','row',independent.view,correct.view),
        button('Remove',()=>{rows.splice(index,1);draw();}));
    }));
  }
  draw();
  modal('Prompt hierarchy',form([list,button('Add prompt',()=>{
    if (rows.length>=24) throw new Error('The hierarchy supports up to 24 prompts.');
    rows.push(['','',false,true]);draw();
  })],'Save prompts',()=>{
    const next=rows.map(([code,label,...rest])=>[code.trim(),label.trim(),...rest]);
    if (!promptList(next)||new Set(next.map(row=>row[0])).size!==next.length) throw new Error('Use unique prompt codes. Independent responses must also be correct.');
    commit(db=>{db.settings.prompts=next;});
    dialog.close();
  }));
}
function uniqueLines(text) { return [...new Set(text.split(/\r?\n/).map(line=>line.trim()).filter(Boolean))]; }
function banksEditor() {
  if(state.settings.privacy) throw new Error('Turn off privacy mode to edit custom ABC labels.');
  const a=field('Antecedents, one per line',state.settings.antecedents.join('\n'),{multiline:true,maxLength:12000});
  const c=field('Consequences, one per line',state.settings.consequences.join('\n'),{multiline:true,maxLength:12000});
  modal('ABC chip banks',form([a.view,c.view],'Save banks',()=>{
    const antecedents=uniqueLines(a.input.value), consequences=uniqueLines(c.input.value);
    if (!bank(antecedents)||!bank(consequences)) throw new Error('Use up to 100 labels per bank, each at most 120 characters.');
    commit(db=>Object.assign(db.settings,{antecedents,consequences}));
    dialog.close();
  }));
}
function noteFieldsEditor() {
  if(state.settings.privacy) throw new Error('Turn off privacy mode to edit custom note labels.');
  const fields=field('Field labels, one per line',state.settings.fields.join('\n'),{multiline:true,maxLength:2000});
  modal('Daily note fields',form([fields.view],'Save fields',()=>{
    const next=uniqueLines(fields.input.value);
    if (!bank(next)||next.length>16) throw new Error('Use up to 16 labels, each at most 120 characters.');
    commit(db=>{db.settings.fields=next;});
    dialog.close();
  }));
}
const darkMode=matchMedia('(prefers-color-scheme: dark)');
const coarse=matchMedia('(pointer: coarse)');
function deviceInfo() {
  const nav=navigator;
  const ua=nav.userAgent;
  let os='Desktop';
  if (/iPad/i.test(ua)||(/Mac/i.test(nav.platform)&&nav.maxTouchPoints>1)) os='iPadOS';
  else if (/iPhone|iPod/i.test(ua)) os='iOS';
  else if (/Android/i.test(ua)) os='Android';
  else if (/Mac/.test(ua)) os='macOS';
  const phone=innerWidth<=650||(innerWidth<860&&(os==='iOS'||(os==='Android'&&/Mobile/.test(ua))));
  return {os,layout:phone?'phone':coarse.matches||os==='iPadOS'?'tablet':'desktop'};
}
function presentation() {
  const s=state.settings, root=document.documentElement;
  const theme=s.theme==='system'?(darkMode.matches?'dark':'light'):s.theme;
  const device=deviceInfo();
  root.dataset.theme=theme;
  root.dataset.layout=s.layout==='auto'?device.layout:s.layout;
  root.dataset.os=device.os;
  const [primary,accent]=palettes[s.palette] || [s.customAccent,s.accent];
  if (theme==='dark' && s.palette!=='custom') root.style.removeProperty('--primary');
  else root.style.setProperty('--primary',primary);
  root.style.setProperty('--accent',s.highlight || accent);
  if (s.card) root.style.setProperty('--panel',s.card);
  else root.style.removeProperty('--panel');
  if (s.palette==='custom') {
    const rgb=primary.slice(1).match(/../g).map(channel=>parseInt(channel,16)/255).map(channel=>channel<=.04045?channel/12.92:((channel+.055)/1.055)**2.4);
    const luminance=rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;
    root.style.setProperty('--button-ink',luminance>.179?'#000':'#fff');
  } else root.style.removeProperty('--button-ink');
}
function render() {
  presentation();
  renderTicks=[];
  if (!selectedLearner()) learnerId=state.learners[0]?.id || '';
  for (const tab of document.querySelectorAll('[data-nav]')) {
    if (page===tab.dataset.nav) tab.setAttribute('aria-current','page');
    else tab.removeAttribute('aria-current');
  }
  $('privacy').textContent='Privacy: '+(state.settings.privacy?'on':'off');
  $('privacy').setAttribute('aria-pressed',String(state.settings.privacy));
  main.replaceChildren();
  ({session:sessionPage,learners:learnerPage,reports:reportPage,settings:settingsPage})[page]();
  tick();
}
function navigate(next) {
  page=next;
  render();
  window.scrollTo(0,0);
}
function tick() {
  const now=Date.now();
  for (const task of renderTicks) task(now);
}
for (const tab of document.querySelectorAll('[data-nav]')) tab.addEventListener('click',()=>navigate(tab.dataset.nav));
$('close-dialog').addEventListener('click',()=>dialog.close());
$('snapshot').addEventListener('click',()=>invoke(quickSnapshot));
$('privacy').addEventListener('click',()=>invoke(()=>{
  commit(db=>{db.settings.privacy=!db.settings.privacy;});
  notice(state.settings.privacy?'Privacy mode enabled':'Privacy mode disabled');
}));
$('undo').addEventListener('click',()=>invoke(undo));
$('dismiss').addEventListener('click',dismiss);
const resize = ()=>{ clearTimeout(resize.timer); resize.timer=setTimeout(()=>{presentation();if (page==='session') render();},160); };
window.addEventListener('resize',resize);
darkMode.addEventListener?.('change',()=>render());
coarse.addEventListener?.('change',()=>render());
let touch;
main.addEventListener('touchstart',event=>{
  if (event.touches.length!==1) {touch=null;return;}
  const point=event.touches[0];
  touch=point.clientX>36?{x:point.clientX,y:point.clientY,at:Date.now()}:null;
},{passive:true});
main.addEventListener('touchend',event=>{
  const point=event.changedTouches[0];
  if (page==='session'&&touch&&point.clientX-touch.x>115&&Math.abs(point.clientY-touch.y)<40&&Date.now()-touch.at<550) invoke(undo);
  touch=null;
},{passive:true});
document.addEventListener('keydown',event=>{
  if (event.defaultPrevented||dialog.open||event.target.closest('input,textarea,select,[contenteditable]')) return;
  if ((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='z'&&!event.shiftKey) {
    if (undoAction) {event.preventDefault();invoke(undo);}
    return;
  }
  if (page!=='session'||event.repeat||event.metaKey||event.ctrlKey||event.altKey) return;
  const session=activeSession();
  if (!session) return;
  const learner=state.learners.find(item=>item.id===session.learner);
  const targets=eligibleTargets(learner);
  if (/^[1-9]$/.test(event.key)) {
    const target=targets.filter(item=>item.type==='frequency')[Number(event.key)-1];
    if (target) {event.preventDefault();invoke(()=>countTap(session,target,1));}
  }
  if (event.code==='Space'&&!event.target.closest('button,summary')) {
    const target=targets.find(item=>['duration','latency'].includes(item.type));
    if (target) {
      event.preventDefault();
      const timer=session.timers[target.id];
      invoke(()=>timerAction(session,target,timer?'stop':'start'));
    }
  }
});
window.addEventListener('beforeunload',event=>{
  if (pending||blocked) {event.preventDefault();event.returnValue='';}
});
async function selfTest() {
  const results=[];
  const test=(label,assertion)=>{
    if (!assertion) throw new Error('Self-check failed: '+label);
    results.push(label);
  };
  const demo=fresh(), learner={id:uid(),name:'Fictional Learner',modules:{}};
  const target={id:uid(),learner:learner.id,name:'Example',description:'',type:'frequency',interval:15,archived:false};
  const session={id:uid(),learner:learner.id,start:'2026-01-01T12:00:00.000Z',end:null,timers:{}};
  demo.learners.push(learner);demo.targets.push(target);demo.sessions.push(session);
  for (let i=0;i<10000;i++) demo.events.push({
    id:uid(),session:session.id,target:target.id,type:'frequency',at:session.start,value:i<9500?1:-1
  });
  test('10,000 count changes preserve the signed total',positiveFrequency(demo.events)===9000);
  test('Large date ranges only aggregate dates with records',
    summarize(learner,{mode:'range',start:'0001-01-01',end:'9999-12-31'},demo).days.length===1);
  test('Exact dates respect leap years',validDay('2024-02-29')&&!validDay('2025-02-29'));
  test('Timer pause and adjustment retain elapsed time',elapsed({ms:1200,since:null},10000)===1200&&elapsed({ms:1200,since:2000},3500)===2700);
  test('CSV preserves quotes, commas, and line breaks',cell('a,"b"\nc')==='"a,""b""\nc"');
  test('CSV keeps numbers numeric and neutralizes formula-like text',cell(-3)==='-3'&&cell(' =1+1')==='"\' =1+1"');
  test('Snapshot restores large valid event collections',parseSnapshot(JSON.stringify(demo)).events.length===10000);
  let rejected=0;
  for (const malformed of ['{','[]','{"format":"Interval-Bolt"}',
    JSON.stringify({...demo,events:[{...demo.events[0],target:uid()}]}),
    JSON.stringify({...demo,targets:[{...target,type:'whole',interval:-10}]})]) {
    try {parseSnapshot(malformed);} catch {rejected++;}
  }
  test('Malformed files, orphan links, and negative intervals are rejected',rejected===5);
  test('Missing workspace object store is detected',(()=>{
    try {idbRepository({objectStoreNames:{contains:()=>false}});return false;} catch {return true;}
  })());
  const stats=trialStats([
    {value:{independent:true,correct:true}},{value:{independent:false,correct:true}},{value:{independent:false,correct:false}}
  ]);
  test('Skill calculations distinguish independent and correct trials',percent(stats.independent,stats.total)==='33.3%'&&percent(stats.correct,stats.total)==='66.7%');
  if (globalThis.indexedDB) {
    const name='interval-bolt-test-'+uid();
    let db;
    try {
      db=await openIDB(name);
      const storage=idbRepository(db);
      test('New IndexedDB workspaces initialize cleanly',!await storage.read());
      await storage.save({...demo,revision:1},0);
      test('IndexedDB round-trips a 10,000-observation snapshot',(await storage.read()).events.length===10000);
      let conflict=false;
      try {await storage.save(demo,0);} catch {conflict=true;}
      test('Stale tab writes cannot overwrite committed observations',conflict&&(await storage.read()).revision===1);
    } finally {
      db?.close();
      indexedDB.deleteDatabase(name);
    }
  }
  return results;
}
Object.defineProperty(window,'IntervalBolt',{value:Object.freeze({selfTest})});
async function boot() {
  try {
    const storage=await repository();
    const stored=await storage.read();
    if (stored) state=validateWorkspace(stored);
    savedRevision=state.revision;
    repo=storage;
  } catch (error) {
    blocked=true;
    persistenceError='Local storage unavailable';
    notice(error.message || persistenceError,null,0);
  }
  status();
  render();
  setInterval(tick,200);
  if (location.protocol!=='file:' && navigator.serviceWorker) {
    const manifest=node('link');
    manifest.rel='manifest';
    manifest.href='./manifest.webmanifest';
    document.head.append(manifest);
    const icon=node('link');
    icon.rel='apple-touch-icon';
    icon.href='./icon-192.png';
    document.head.append(icon);
    try { await navigator.serviceWorker.register('./sw.js'); }
    catch { notice('Offline installation is unavailable. You can still record on this device.',null,8000); }
  }
}
boot().catch(error=>notice(error.message,null,0));
